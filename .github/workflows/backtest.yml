name: Historical technical backtest
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/backtest.py
      - .github/workflows/backtest.yml
permissions:
  contents: write
concurrency:
  group: stockmaster-backtest
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/backtest.py
      - name: Publish historical technical backtest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update historical technical backtest"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase -X theirs origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 2
            done
            exit 1
          fi
