name: Refresh intraday index quotes
on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 13-22 * * 1-5'
permissions:
  contents: write
concurrency:
  group: stockmaster-index-quotes
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas
      - run: python scripts/update_indices.py
      - name: Publish index quotes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/index_live.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh intraday index quotes"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase -X theirs origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 3
            done
            exit 1
          fi
